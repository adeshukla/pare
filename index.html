<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pare — optimize your assets in the browser</title>
    <meta name="description" content="Compress and convert images, fonts and code without installing anything. Your files never leave your browser." />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://pare.devstash.me/" />
    <!-- alternates -->
    <link rel="alternate" hreflang="en" href="https://pare.devstash.me/" />
    <link rel="alternate" hreflang="hi" href="https://pare.devstash.me/hi/" />
    <link rel="alternate" hreflang="es" href="https://pare.devstash.me/es/" />
    <link rel="alternate" hreflang="pt" href="https://pare.devstash.me/pt/" />
    <link rel="alternate" hreflang="id" href="https://pare.devstash.me/id/" />
    <link rel="alternate" hreflang="x-default" href="https://pare.devstash.me/" />
    <!-- /alternates -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pare" />
    <meta property="og:url" content="https://pare.devstash.me/" />
    <meta property="og:title" content="Pare — shrink images, fonts and code in your browser" />
    <meta property="og:description" content="AVIF, WebP, HEIC, fonts, CSS, JS and whole sites. Free, no upload, no account." />
    <meta property="og:image" content="https://pare.devstash.me/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pare it down. Shrink images, fonts and code in your browser." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%239333ea'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 23V9h7a5 5 0 0 1 0 10h-4' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply a chosen theme before first paint, so a dark-mode visitor never
      // sees a white flash. Storage can throw in a private window; then the
      // system setting applies, which is the default anyway.
      try {
        var t = localStorage.getItem('pare:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
