version: 2
updates:
  # The image codecs move fast and a broken WASM build is invisible until it is
  # run, so grouped weekly bumps go through the same CI as everything else.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      jsquash:
        patterns: ['@jsquash/*', 'thumbhash']
      build-tooling:
        patterns: ['vite', '@vitejs/*', 'tailwindcss', '@tailwindcss/*', 'typescript']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'eslint', 'typescript-eslint', '@eslint/*']

  # Grouped, because four separate PRs for four action bumps is noise when they
  # are always reviewed and merged together anyway.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
